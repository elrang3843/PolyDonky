name: .NET Libraries & Tests (Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PolyDonky.sln -p:EnableWindowsTargeting=true

      - name: Build (WPF 포함 — EnableWindowsTargeting)
        run: dotnet build PolyDonky.sln -c Debug --no-restore -p:EnableWindowsTargeting=true

      - name: Test (App.Tests 제외 — WPF 단위 테스트는 Windows 전용)
        run: >
          dotnet test PolyDonky.sln -c Debug --no-build --verbosity normal
          --filter "FullyQualifiedName!~PolyDonky.App.Tests"
          -p:EnableWindowsTargeting=true
