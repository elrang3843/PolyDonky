name: WPF Desktop Build & Release

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: PolyDonky.sln
      App_Project: src\PolyDonky.App\PolyDonky.App.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name -c ${{ matrix.configuration }} --no-restore

      - name: Test (cross-platform libs only)
        run: >
          dotnet test $env:Solution_Name -c ${{ matrix.configuration }} --no-build
          --filter "FullyQualifiedName!~PolyDonky.App.Tests"
          --verbosity normal

      - name: Test (WPF App.Tests — Windows only)
        run: >
          dotnet test tests\PolyDonky.App.Tests\PolyDonky.App.Tests.csproj
          -c ${{ matrix.configuration }} --no-build --verbosity normal

  release:
    # v* 태그 푸시 시에만 실행
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      App_Project: src\PolyDonky.App\PolyDonky.App.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:App_Project

      - name: Publish portable (self-contained, win-x64)
        run: >
          dotnet publish $env:App_Project
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish\PolyDonky
          --no-restore

      - name: Create ZIP
        run: |
          $tag    = "${{ github.ref_name }}"
          $name   = "PolyDonky-$tag-win-x64"
          Compress-Archive -Path publish\PolyDonky\* -DestinationPath "$name.zip"
          echo "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: "PolyDonky ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: "${{ env.ZIP_NAME }}.zip"
