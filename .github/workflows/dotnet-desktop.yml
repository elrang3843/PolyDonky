name: WPF Desktop Build & MSIX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: PolyDonky.sln
      App_Project: src\PolyDonky.App\PolyDonky.App.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name -c ${{ matrix.configuration }} --no-restore

      - name: Test (cross-platform libs only)
        run: >
          dotnet test $env:Solution_Name -c ${{ matrix.configuration }} --no-build
          --filter "FullyQualifiedName!~PolyDonky.App.Tests"
          --verbosity normal

      - name: Test (WPF App.Tests — Windows only)
        run: >
          dotnet test tests\PolyDonky.App.Tests\PolyDonky.App.Tests.csproj
          -c ${{ matrix.configuration }} --no-build --verbosity normal

      # MSIX 패키지 생성 — Release 빌드에서만 수행
      - name: Publish MSIX (Release only)
        if: matrix.configuration == 'Release'
        run: >
          dotnet publish $env:App_Project
          -p:PublishProfile=MSIX
          --no-restore
          -v normal

      # 서명 (옵션 — GitHub secret 이 설정된 경우에만 활성)
      - name: Sign MSIX
        if: matrix.configuration == 'Release' && env.BASE64_ENCODED_PFX != ''
        env:
          BASE64_ENCODED_PFX: ${{ secrets.Base64_Encoded_Pfx }}
          PFX_KEY: ${{ secrets.Pfx_Key }}
        run: |
          $pfxBytes = [System.Convert]::FromBase64String($env:BASE64_ENCODED_PFX)
          $pfxPath  = Join-Path $env:TEMP "SigningCert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $msixPath = Get-ChildItem -Recurse -Filter "*.msix" | Select-Object -First 1 -ExpandProperty FullName
          if ($msixPath) {
            & "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" sign `
              /fd SHA256 /p7ce DetachedSignedData /p "$env:PFX_KEY" /f "$pfxPath" "$msixPath"
          }
          Remove-Item $pfxPath -Force

      - name: Upload MSIX artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: PolyDonky-MSIX-x64
          path: "**/*.msix"
          if-no-files-found: warn
